<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whiteboard Studio</title>
    <style>
:root { --bg:#101418; --card:#182027; --fg:#eaf1f6; --muted:#9bb0bf; --accent:#4aa3ff; --line:#26313a; }
* { box-sizing:border-box; }
body { margin:0; padding:2rem 1rem 4rem; background:var(--bg); color:var(--fg);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
main { max-width:44rem; margin:0 auto; }
h1 { font-size:1.75rem; line-height:1.25; margin:0 0 .35rem; }
h2 { font-size:1.1rem; margin:2.25rem 0 .5rem; color:var(--accent); }
h3 { font-size:1rem; margin:1.5rem 0 .35rem; }
.date { color:var(--muted); font-size:.9rem; margin:0 0 2rem; }
a { color:var(--accent); }
ul { padding-left:1.25rem; }
li { margin:.3rem 0; }
.lang { display:flex; gap:.5rem; margin:0 0 2rem; }
.lang a { padding:.35rem .8rem; border:1px solid var(--line); border-radius:99px;
  text-decoration:none; font-size:.9rem; background:var(--card); }
hr { border:0; border-top:1px solid var(--line); margin:3rem 0; }
footer { color:var(--muted); font-size:.85rem; margin-top:3rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Whiteboard Studio</h1>
      <p class="date">A digital whiteboard for iPad and Mac. No account, no cloud, no subscription.</p>
      <ul>
        <li><a href="support.html">Support / Hilfe</a></li>
        <li><a href="privacy.html">Privacy Policy / Datenschutzerklärung</a></li>
      </ul>
      <footer>Whiteboard Studio — niedigaming, Österreich · <a href="mailto:niedigaming@gmail.com">niedigaming@gmail.com</a></footer>
    </main>
  </body>
</html>
